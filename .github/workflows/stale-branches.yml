name: stale-branches

# Weekly report: one issue titled "Stale branches" listing unmerged branches with no commit for 30+ days.
# Report only. Nothing is deleted. Run it by hand from the Actions tab (Run workflow).
# Branch names are untrusted: they are only ever written to a file as data, never into a command line.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build the list
        shell: bash
        run: |
          set -euo pipefail
          cutoff=$(date -d '30 days ago' +%s)
          # Branches whose pull request was already merged (squash merges leave the branch "unmerged" in git).
          gh pr list --state merged --limit 1000 --json headRefName --jq '.[].headRefName' | sort -u > merged.txt
          gh pr list --state open --limit 500 --json headRefName,number --jq '.[] | "\(.headRefName)\t#\(.number)"' > open.txt
          git branch -r --no-merged "origin/${DEFAULT_BRANCH}" --format='%(refname:lstrip=3)' | sort -u > unmerged.txt
          git for-each-ref --format='%(refname:lstrip=3)%09%(committerdate:unix)%09%(committerdate:short)' refs/remotes/origin > dates.tsv
          awk -F'\t' -v cutoff="$cutoff" -v def="$DEFAULT_BRANCH" '
            FILENAME == "merged.txt"   { merged[$0] = 1; next }
            FILENAME == "unmerged.txt" { unmerged[$0] = 1; next }
            FILENAME == "open.txt"     { opened[$1] = $2; next }
            ($1 in unmerged) && $1 != "HEAD" && $1 != def && !($1 in merged) && $2 < cutoff {
              printf "| `%s` | %s | %s |\n", $1, $3, ($1 in opened ? opened[$1] : "")
            }' merged.txt unmerged.txt open.txt dates.tsv | sort > rows.md
          count=$(wc -l < rows.md | tr -d ' ')
          {
            echo "Unmerged branches with no commit for 30+ days: **${count}**. Nothing is deleted; delete or revive each one by hand."
            echo
            if [ "$count" -gt 0 ]; then
              echo "| Branch | Last commit | Open PR |"
              echo "| --- | --- | --- |"
              cat rows.md
              echo
            fi
            echo "Updated by the stale-branches workflow: ${RUN_URL}"
          } > body.md
          echo "count=${count}" >> "$GITHUB_ENV"
      - name: Create or update the issue
        shell: bash
        run: |
          set -euo pipefail
          existing=$(gh issue list --state open --search 'in:title "Stale branches"' --json number,title --jq '[.[] | select(.title == "Stale branches")][0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file body.md
            echo "Updated issue #${existing} (${count} stale branches)"
          else
            gh issue create --title "Stale branches" --body-file body.md
          fi
