<!doctype html>
<html lang="he"><head><meta charset="utf-8"><meta name="design_doc_mode" content="canvas"><title>Cook View refactor — phone</title>
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
a{color:#0f766e}a:hover{color:#0d9488}
body{margin:0;background:#e9eef0;font-family:Heebo,system-ui,sans-serif}
.lab{position:absolute;font:700 13px/1.3 Heebo;color:#475569;letter-spacing:.02em;width:390px}
.col-h{position:absolute;width:390px;font:800 22px/1.1 Heebo;color:#0f172a}.col-h small{display:block;font:500 13px/1.4 Heebo;color:#475569;margin-top:6px}
.phone{position:absolute;width:390px;height:780px;border-radius:38px;border:8px solid #0f172a;box-sizing:border-box;overflow:hidden;background:var(--bg);box-shadow:0 30px 60px -30px rgba(15,23,42,.45);direction:rtl;color:var(--ink);display:flex;flex-direction:column;
--bg:#f0f4f8;--card:rgba(255,255,255,.78);--card-s:#fff;--ink:#0f172a;--mute:#64748b;--line:rgba(15,23,42,.1);--pri:#0f766e;--pri-2:#14b8a6;--soft:rgba(20,184,166,.12);--soft-ink:#0f766e;--warn:#b45309;--warn-bg:rgba(245,158,11,.16);--tab:rgba(255,255,255,.85)}
.phone.dark{--bg:#0a1614;--card:rgba(255,255,255,.05);--card-s:#14302d;--ink:#f1f5f4;--mute:rgba(226,240,236,.74);--line:rgba(255,255,255,.12);--pri:#14b8a6;--pri-2:#2dd4bf;--soft:rgba(20,184,166,.18);--soft-ink:#5eead4;--warn:#fbbf24;--warn-bg:rgba(245,158,11,.2);--tab:rgba(10,22,20,.85);background:radial-gradient(ellipse 600px 400px at 50% -10%,#0f2e2a,#0a1614 60%)}
.phone:not(.dark){background:radial-gradient(ellipse 500px 380px at 8% -5%,rgba(20,184,166,.22),transparent 60%),radial-gradient(ellipse 400px 300px at 100% 100%,rgba(245,158,11,.14),transparent 60%),#f0f4f8}
.phone *{box-sizing:border-box}.phone svg{flex-shrink:0}
.body{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;position:relative}
.tabbar{height:56px;flex-shrink:0;display:flex;background:var(--tab);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tabbar span{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--mute)}
.tabbar span.on{color:var(--soft-ink);font-weight:700}
.num{font-variant-numeric:tabular-nums}.sf svg{fill:currentColor}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.b-nav{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line)}
.b-nav b{font-size:14px;font-weight:700}.b-tg{width:36px;height:36px;border-radius:50%;display:grid;place-content:center;background:var(--soft);color:var(--soft-ink)}
.b-hero{position:relative;margin:10px 12px 0;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,#0f766e,#115e59);color:#fff;padding:12px 14px;min-height:128px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px}
.b-badges{display:flex;gap:6px}.b-badge{font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.2)}
.b-hero h1{font-size:19px;font-weight:800;margin:0;color:#fff;letter-spacing:0}.b-stars{display:flex;gap:2px;color:#fbbf24}
.b-prog{font-size:11px;display:flex;justify-content:space-between}.b-track{height:5px;border-radius:9px;background:rgba(255,255,255,.28);overflow:hidden}.b-track i{display:block;height:100%;background:#5eead4}
.b-actions{display:flex;gap:8px;padding:10px 12px 0}.b-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;background:var(--card-s);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--soft-ink)}
.b-swap{display:flex;margin-top:10px;border-bottom:1px solid var(--line)}.b-swap span{flex:1;text-align:center;padding:11px 4px;font-size:12px;font-weight:600;color:var(--mute);border-bottom:3px solid transparent}.b-swap span.on{color:var(--soft-ink);border-color:var(--pri-2)}
.b-pane{margin:10px 12px 0;border-radius:16px;background:var(--card);border:1px solid var(--line);flex:1;min-height:0;overflow:hidden}
.b-ph{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px;font-weight:700;color:var(--soft-ink)}.b-cnt{margin-inline-start:auto;font-size:11.5px;padding:3px 9px;border-radius:99px;background:var(--soft)}
.b-card{margin:9px 10px 0;padding:11px 12px;border-radius:12px;border:1px solid var(--line);font-size:13px;line-height:1.5}.b-card.act{border-color:var(--pri-2);box-shadow:0 0 0 2px rgba(20,184,166,.25);background:var(--soft)}.b-card.done{opacity:.6}
.b-ch{display:flex;align-items:center;gap:8px;margin-bottom:5px}.b-n{width:22px;height:22px;border-radius:50%;display:grid;place-content:center;font-size:11px;font-weight:700;background:var(--soft);color:var(--soft-ink)}.b-n.on{background:var(--pri-2);color:#fff}
.b-pills{display:flex;gap:6px;margin:8px 0}.b-pill{font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:99px;background:var(--card-s);border:1px solid var(--line)}
.b-done{width:100%;padding:9px;border-radius:12px;background:linear-gradient(180deg,#14b8a6,#0d9488);color:#fff;font-weight:700;font-size:13px}
.b-sc{display:flex;gap:6px;flex-wrap:wrap;padding:9px 12px;border-bottom:1px solid var(--line);align-items:center}.b-chip{font-size:12px;font-weight:600;padding:5px 11px;border-radius:99px;background:var(--card-s);border:1px solid var(--line)}.b-chip.on{background:var(--pri-2);color:#fff;border-color:transparent}
.b-row{display:grid;grid-template-columns:22px 1fr auto auto 20px;gap:8px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13px}.b-ck{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);background:var(--card-s);display:grid;place-content:center;color:#fff}.b-ck.on{background:var(--pri-2);border-color:var(--pri-2)}
.a-h{display:flex;align-items:center;gap:6px;height:56px;padding:0 10px;flex-shrink:0}.a-h h1{flex:1;font-size:18px;font-weight:800;margin:0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.a-ib{width:44px;height:44px;border-radius:50%;display:grid;place-content:center;color:var(--mute)}.a-ib.on{background:var(--soft);color:var(--soft-ink)}
.a-meta{display:flex;gap:8px;padding:0 16px;flex-wrap:wrap;align-items:center}.a-c{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:5px 10px;border-radius:99px;background:var(--soft);color:var(--soft-ink)}.a-c.w{background:var(--warn-bg);color:var(--warn)}
.a-prog{padding:14px 16px 0;display:grid;gap:8px}.a-pr{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--mute)}.a-pr b{color:var(--ink);min-width:44px}.a-bar{flex:1;height:8px;border-radius:9px;background:var(--line);overflow:hidden}.a-bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--pri),var(--pri-2))}
.a-seg{display:flex;margin:14px 16px 0;padding:4px;border-radius:14px;background:var(--line)}.a-seg span{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:11px;font-size:15px;font-weight:700;color:var(--mute)}.a-seg span.on{background:var(--card-s);color:var(--ink);box-shadow:0 2px 8px -2px rgba(0,0,0,.2)}.a-seg em{font-style:normal;font-size:12.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--soft-ink)}
.a-list{flex:1;min-height:0;overflow:hidden;padding:14px 16px 0;display:grid;gap:10px;align-content:start}
.a-dn{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 14px;border-radius:14px;color:var(--mute);font-size:15px}.a-dn s{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.a-ok{width:26px;height:26px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-content:center}
.a-act{border-radius:22px;padding:18px 18px 16px;background:var(--card-s);border:2px solid var(--pri-2);box-shadow:0 16px 36px -18px rgba(20,184,166,.55)}
.a-lab{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--soft-ink);margin-bottom:10px}.a-lab i{width:8px;height:8px;border-radius:50%;background:var(--pri-2)}
.a-act p{font-size:21px;line-height:1.5;font-weight:500;margin:0;color:var(--ink)}
.a-tm{display:flex;align-items:center;gap:12px;margin-top:16px;padding:10px 14px;border-radius:16px;background:var(--soft)}.a-tm b{flex:1;font-size:44px;line-height:1;font-weight:800;color:var(--soft-ink);letter-spacing:-.02em}.a-tm button{width:48px;height:48px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-content:center}.a-tm button.g{background:var(--card-s);color:var(--soft-ink);border:1px solid var(--line)}
.a-go{width:100%;height:56px;margin-top:14px;border-radius:16px;background:var(--pri);color:#fff;font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px}
.dark .a-go,.dark .f-row .go,.dark .a-tm button,.dark .f-tb button.p,.dark .a-ok,.dark .a-sc .ch.on{color:#04211e}
.a-pd{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:16px;font-weight:500}.a-pd .n{width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--soft-ink);display:grid;place-content:center;font-size:14px;font-weight:700}.a-pd span.t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.a-pd em{font-style:normal;font-size:13px;font-weight:600;color:var(--mute)}
.a-sc{display:flex;gap:6px;align-items:center;margin:14px 16px 0;flex-wrap:wrap}.a-sc .ch{height:44px;min-width:44px;padding:0 8px;border-radius:99px;display:grid;place-content:center;background:var(--card-s);border:1px solid var(--line);font-size:15px;font-weight:700}.a-sc .ch.on{background:var(--pri);color:#fff;border-color:transparent}.a-sc .q{margin-inline-start:auto;display:flex;flex-shrink:0;align-items:center;gap:4px;padding:4px;border-radius:99px;background:var(--card-s);border:1px solid var(--line)}.a-sc .q b{min-width:46px;text-align:center;font-size:17px;font-weight:800}.a-sc .q span{width:36px;height:36px;border-radius:50%;background:var(--soft);color:var(--soft-ink);display:grid;place-content:center}
.a-ing{display:flex;align-items:center;gap:14px;min-height:60px;padding:0 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:17px;font-weight:600}.a-ing .ck{width:30px;height:30px;border-radius:9px;border:2px solid var(--mute);display:grid;place-content:center;color:#fff}.a-ing.on .ck{background:var(--pri);border-color:var(--pri)}.a-ing.on .nm{color:var(--mute);text-decoration:line-through}.a-ing .nm{flex:1}.a-ing .am{font-size:19px;font-weight:800}.a-ing .un{font-size:14px;color:var(--mute);min-width:36px}
.a-menu{position:absolute;top:52px;inset-inline-start:10px;width:300px;border-radius:20px;background:var(--card-s);border:1px solid var(--line);box-shadow:0 24px 50px -16px rgba(0,0,0,.45);padding:8px;z-index:5}.a-mi{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 10px;border-radius:12px;font-size:15px;font-weight:600}.a-mi>span:first-of-type{flex:1}.a-mi .ab{width:44px;height:36px;border-radius:10px;background:var(--soft);color:var(--soft-ink);display:grid;place-content:center;flex:none}.a-mh{font-size:12px;font-weight:700;color:var(--mute);padding:8px 10px 2px;letter-spacing:.04em}.a-ms{height:1px;background:var(--line);margin:6px 4px}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.28);z-index:4}
.f-top{padding:12px 16px 0;flex-shrink:0}.f-seg{display:flex;gap:5px}.f-seg i{flex:1;height:6px;border-radius:9px;background:var(--line)}.f-seg i.d{background:var(--pri)}.f-seg i.n{background:var(--pri-2);box-shadow:0 0 0 3px rgba(20,184,166,.25)}
.f-bar{display:flex;align-items:center;gap:4px;height:52px}.f-bar .t{flex:1;font-size:15px;font-weight:700;color:var(--mute)}.f-bar .t b{color:var(--ink);font-size:17px}
.f-main{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;padding:6px 20px 0;gap:14px}
.f-name{font-size:13px;font-weight:700;color:var(--soft-ink);display:flex;align-items:center;gap:6px}
.f-txt{font-size:27px;line-height:1.45;font-weight:600;margin:0;color:var(--ink);text-wrap:pretty}
.f-dial{align-self:center;position:relative;width:216px;height:216px;margin-top:4px}.f-dial svg{position:absolute;inset:0}.f-dial .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.f-dial b{font-size:56px;font-weight:800;line-height:1;letter-spacing:-.03em;color:var(--ink)}.f-dial small{font-size:13px;font-weight:600;color:var(--mute)}
.f-tb{display:flex;justify-content:center;gap:14px}.f-tb button{width:56px;height:56px;border-radius:50%;display:grid;place-content:center;background:var(--card-s);border:1px solid var(--line);color:var(--soft-ink)}.f-tb button.p{background:var(--pri);color:#fff;border:0}
.f-amt{align-self:flex-start;font-size:56px;font-weight:800;color:var(--ink);line-height:1.1}.f-amt small{font-size:24px;color:var(--mute);font-weight:600;margin-inline-start:8px}
.f-dock{padding:10px 16px 12px;display:grid;gap:10px;flex-shrink:0}.f-ing{height:44px;border-radius:99px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:700;color:var(--soft-ink)}
.f-row{display:flex;gap:10px}.f-row .s{width:56px;height:60px;border-radius:18px;background:var(--card-s);border:1px solid var(--line);display:grid;place-content:center;color:var(--mute)}.f-row .go{flex:1;height:60px;border-radius:18px;background:var(--pri);color:#fff;font-size:19px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px}
.f-sheet{position:absolute;inset-inline:0;bottom:0;height:78%;border-radius:26px 26px 0 0;background:var(--card-s);border:1px solid var(--line);box-shadow:0 -20px 50px -20px rgba(0,0,0,.5);z-index:5;display:flex;flex-direction:column;padding:8px 16px 12px}.f-sheet .gr{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 8px}.f-sh{display:flex;align-items:center;gap:10px;height:44px;font-size:18px;font-weight:800}.f-sh span{margin-inline-start:auto;font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--soft-ink)}
.f-sheet .a-list{padding:8px 0 0;gap:8px}.f-sheet .a-sc{margin:6px 0 0}
</style></head><body>
<div id="root"></div>
<script>
const I=(n,s=18,w=2)=>`<i data-lucide="${n}" style="width:${s}px;height:${s}px;stroke-width:${w}"></i>`;
const stars=n=>Array.from({length:5},(_,i)=>`<span class="${i<n?'sf':''}" style="display:inline-flex;opacity:${i<n?1:.35}">${I('star',12)}</span>`).join('');
const tabs=`<div class="tabbar"><span>${I('circle-user-round',22)}פרופיל</span><span>${I('layout-dashboard',22)}דשבורד</span><span>${I('package',22)}מלאי</span><span class="on">${I('book-open',22)}מתכונים</span><span>${I('library',22)}תפריטים</span></div>`;
const ph=(x,y,body,dark)=>`<div class="phone ${dark?'dark':''}" style="left:${x}px;top:${y}px"><div class="body">${body}</div>${tabs}</div>`;
const steps=['מרסקים את העגבניות ומסננים עודפי נוזלים','מבשלים על להבה נמוכה עד להסמכה, מערבבים מדי כמה דקות','מתבלים במלח ובזיליקום ומטעמים','מצננים ומעבירים למכל סגור ומתויג'];
const ings=[['עגבניות מרוסקות','2.5','ק״ג',1],['בצל קצוץ','400','גרם',1],['שום','60','גרם',1],['שמן זית','120','מ״ל',0],['בזיליקום','40','גרם',0],['מלח','25','גרם',0]];
const prep=[['פסטה פנה','800','גרם'],['רוטב עגבניות','1.2','ל׳'],['בזיליקום קצוץ','30','גרם'],['גבינת פרמזן מגורדת','150','גרם'],['שמן זית','60','מ״ל']];
const bHero=(t,dish)=>`<div class="b-nav"><b>מצב בישול</b><span class="b-tg">${I('moon',16)}</span></div><div class="b-hero"><div class="b-badges"><span class="b-badge">✓ מאושר</span><span class="b-badge">₪${dish?'184':'236'}</span></div><h1>${t}</h1><div class="b-stars">${stars(4)}</div><div class="b-prog"><span>התקדמות הכנה</span><span>${dish?'40':'25'}%</span></div><div class="b-track"><i style="width:${dish?40:25}%"></i></div></div><div class="b-actions"><span class="b-btn">${I('pencil',15)}עריכה</span><span class="b-btn">${I('download',15)}ייצוא</span></div>`;
const bSwap=(on,dish)=>`<div class="b-swap"><span class="${on==0?'on':''}">🧪 אינדקס מצרכים</span><span class="${on==1?'on':''}">⏱ ${dish?'רשימת הכנה':'זרימת הכנה'}</span></div>`;
const bSteps=()=>`<div class="b-pane"><div class="b-ph">${I('timer',16)}זרימת הכנה<span class="b-cnt num">1/4</span></div><div class="b-card done"><div class="b-ch"><span class="b-n on">✓</span>הושלם</div>${steps[0]}</div><div class="b-card act"><div class="b-ch"><span class="b-n on">2</span><b style="font-size:12px;color:var(--soft-ink)">פעיל עכשיו</b></div>${steps[1]}<div class="b-pills"><span class="b-pill">⏱ 12:00 ⏸</span><span class="b-pill">⌚ סטופר</span></div><button class="b-done">✓ &nbsp;סמן כהושלם</button></div><div class="b-card"><div class="b-ch"><span class="b-n">3</span></div>${steps[2]}</div><div class="b-card"><div class="b-ch"><span class="b-n">4</span></div>${steps[3]}</div></div>`;
const bPrep=()=>`<div class="b-pane"><div class="b-ph">${I('timer',16)}רשימת הכנה (מיז אן פלאס)<span class="b-cnt num">2/5</span></div>${prep.map((p,i)=>i<2?`<div class="b-card done"><div class="b-ch"><span class="b-n on">✓</span>הושלם</div>${p[1]} ${p[2]} ${p[0]}</div>`:i==2?`<div class="b-card act"><div class="b-ch"><span class="b-n on">3</span><b style="font-size:12px;color:var(--soft-ink)">פעיל עכשיו</b></div>${p[1]} ${p[2]} ${p[0]}<div style="height:8px"></div><button class="b-done">✓ &nbsp;סמן כהושלם</button></div>`:`<div class="b-card"><div class="b-ch"><span class="b-n">${i+1}</span></div>${p[1]} ${p[2]} ${p[0]}</div>`).join('')}</div>`;
const bIng=()=>`<div class="b-pane"><div class="b-ph">${I('flask-conical',16)}אינדקס מצרכים<span class="b-cnt num">3/6</span></div><div class="b-sc">${['×½','×1','×2','×3'].map((c,i)=>`<span class="b-chip ${i==1?'on':''}">${c}</span>`).join('')}<span style="font-size:12px;font-weight:600;color:var(--mute);margin-inline-start:auto">כמות להכנה</span></div>${ings.map(r=>`<div class="b-row"><span class="b-ck ${r[3]?'on':''}">${r[3]?I('check',13,3):''}</span><span>${r[0]}</span><b class="num">${r[1]}</b><span>${r[2]}</span><span style="color:var(--mute)">${I('scale',14)}</span></div>`).join('')}</div>`;
const aHead=(t,menu)=>`<div class="a-h"><span class="a-ib">${I('arrow-right',22)}</span><h1>${t}</h1><span class="a-ib">${I('moon',20)}</span><span class="a-ib ${menu?'on':''}">${I('ellipsis-vertical',22)}</span></div>`;
const aMeta=dish=>`<div class="a-meta"><span class="a-c">${I('check',14,3)}מאושר</span><span class="a-c num">₪${dish?184:236}</span><span class="a-c">${dish?'12 מנות':'10 ל׳'}</span><span class="a-c w">${stars(4)}</span></div>`;
const aProg=(a,b,dish)=>{const p=s=>s.split('/')[0]/s.split('/')[1]*100;return `<div class="a-prog"><div class="a-pr"><b class="num">${a}</b>${dish?'פריטי הכנה':'שלבים'}<span class="a-bar"><i style="width:${p(a)}%"></i></span></div><div class="a-pr"><b class="num">${b}</b>מצרכים<span class="a-bar"><i style="width:${p(b)}%"></i></span></div></div>`};
const aSeg=(on,a,b,dish)=>`<div class="a-seg"><span class="${on==0?'on':''}">מצרכים<em class="num">${b}</em></span><span class="${on==1?'on':''}">${dish?'הכנה':'שלבים'}<em class="num">${a}</em></span></div>`;
const aSteps=()=>`<div class="a-list"><div class="a-dn"><span class="a-ok">${I('check',15,3)}</span><s>${steps[0]}</s><span>${I('undo-2',18)}</span></div><div class="a-act"><div class="a-lab"><i></i>שלב 2 · פעיל עכשיו</div><p>${steps[1]}</p><div class="a-tm"><b class="num">12:00</b><button class="g">${I('timer-reset',22)}</button><button>${I('pause',22)}</button></div><button class="a-go">${I('check',22,3)}סיימתי</button></div><div class="a-pd"><span class="n">3</span><span class="t">${steps[2]}</span></div><div class="a-pd"><span class="n">4</span><span class="t">${steps[3]}</span></div></div>`;
const aPrep=()=>`<div class="a-list">${prep.slice(0,2).map(p=>`<div class="a-dn"><span class="a-ok">${I('check',15,3)}</span><s>${p[1]} ${p[2]} ${p[0]}</s><span>${I('undo-2',18)}</span></div>`).join('')}<div class="a-act"><div class="a-lab"><i></i>פריט 3 · פעיל עכשיו</div><p><b class="num" style="font-size:34px;font-weight:800">30 גרם</b><br>בזיליקום קצוץ</p><button class="a-go">${I('check',22,3)}סיימתי</button></div>${prep.slice(3).map((p,i)=>`<div class="a-pd"><span class="n">${i+4}</span><span class="t">${p[0]}</span><em class="num">${p[1]} ${p[2]}</em></div>`).join('')}</div>`;
const ingRows=(n)=>ings.slice(0,n).map(r=>`<div class="a-ing ${r[3]?'on':''}"><span class="ck">${r[3]?I('check',18,3):''}</span><span class="nm">${r[0]}</span><span class="am num">${r[1]}</span><span class="un">${r[2]}</span></div>`).join('');
const scale=`<div class="a-sc">${['½','1','2','3'].map((c,i)=>`<span class="ch num ${i==1?'on':''}">×${c}</span>`).join('')}<span class="q"><span>${I('minus',18)}</span><b class="num">10</b><span>${I('plus',18)}</span></span></div>`;
const aIng=()=>scale+`<div class="a-list">${ingRows(5)}</div>`;
const aMenu=()=>`<div class="scrim"></div><div class="a-menu"><div class="a-mi"><span>עריכת מתכון</span>${I('pencil',20)}</div><div class="a-ms"></div><div class="a-mh">ייצוא</div>${['מידע על המתכון','רשימת קניות','שלבי בישול'].map(t=>`<div class="a-mi"><span>${t}</span><span class="ab">${I('eye',18)}</span><span class="ab">${I('download',18)}</span></div>`).join('')}</div>`;
const fTop=(n,tot,dish)=>`<div class="f-top"><div class="f-seg">${Array.from({length:tot},(_,i)=>`<i class="${i<n-1?'d':i==n-1?'n':''}"></i>`).join('')}</div><div class="f-bar"><span class="a-ib">${I('arrow-right',22)}</span><span class="t">${dish?'פריט':'שלב'} <b class="num">${n}</b> מתוך <span class="num">${tot}</span></span><span class="a-ib">${I('moon',20)}</span><span class="a-ib">${I('ellipsis-vertical',22)}</span></div></div>`;
const fDock=()=>`<div class="f-dock"><div class="f-ing">${I('flask-conical',18)}מצרכים <span class="num">3/6</span>${I('chevron-up',18)}</div><div class="f-row"><span class="s">${I('chevron-right',24)}</span><button class="go">${I('check',24,3)}סיימתי</button><span class="s">${I('chevron-left',24)}</span></div></div>`;
const dial=`<div class="f-dial"><svg viewBox="0 0 216 216"><circle cx="108" cy="108" r="98" fill="none" stroke="var(--line)" stroke-width="12"/><circle cx="108" cy="108" r="98" fill="none" stroke="var(--pri-2)" stroke-width="12" stroke-linecap="round" stroke-dasharray="616" stroke-dashoffset="190" transform="rotate(-90 108 108)"/></svg><div class="c"><b class="num">12:00</b><small>נותרו</small></div></div><div class="f-tb"><button>${I('timer-reset',24)}</button><button class="p">${I('pause',26)}</button><button>${I('watch',24)}</button></div>`;
const fMain=()=>`${fTop(2,4)}<div class="f-main"><div class="f-name">${I('timer',16)}פעיל עכשיו</div><p class="f-txt">${steps[1]}</p>${dial}</div>`;
const fSteps=()=>fMain()+fDock();
const fPrep=()=>`${fTop(3,5,1)}<div class="f-main"><div class="f-name">${I('list-checks',16)}מיז אן פלאס</div><div class="f-amt num">30<small>גרם</small></div><p class="f-txt">בזיליקום קצוץ</p></div>${fDock()}`;
const fIng=()=>fMain()+`<div class="scrim"></div><div class="f-sheet"><div class="gr"></div><div class="f-sh">${I('flask-conical',22)}מצרכים<span class="num">3/6</span></div>${scale}<div class="a-list">${ingRows(4)}</div></div>`;
const R='רוטב עגבניות קלאסי',D='פסטה פומודורו';
const X=[60,510,960],Y=[150,1000,1850,2700];
let h=`<div class="col-h" style="left:${X[0]}px;top:40px">לפני · האפליקציה כיום<small>Heebo, אימוג׳י, שורת ייצוא, שני פאנלים מתחלפים</small></div><div class="col-h" style="left:${X[1]}px;top:40px">A · פאנל רגוע<small>אותו מבנה, טיפוגרפיה גדולה, ייצוא בתפריט אחד, טיימר גדול</small></div><div class="col-h" style="left:${X[2]}px;top:40px">B · מצב פוקוס<small>שלב אחד במסך, מצרכים במגירה, כפתור סיום גדול</small></div>`;
const rows=[
 ['מתכון · שלבים',ph(X[0],Y[0],bHero(R)+bSwap(1)+bSteps()),ph(X[1],Y[0],aHead(R)+aMeta()+aProg('1/4','3/6')+aSeg(1,'1/4','3/6')+aSteps()),ph(X[2],Y[0],fSteps())],
 ['מתכון · מצרכים',ph(X[0],Y[1],bHero(R)+bSwap(0)+bIng()),ph(X[1],Y[1],aHead(R)+aMeta()+aProg('1/4','3/6')+aSeg(0,'1/4','3/6')+aIng()),ph(X[2],Y[1],fIng())],
 ['מצב מטבח כהה · תפריט ייצוא פתוח (A) ומגירת מצרכים (B)',ph(X[0],Y[2],bHero(R)+bSwap(1)+bSteps(),1),ph(X[1],Y[2],aHead(R,1)+aMeta()+aProg('1/4','3/6')+aSeg(1,'1/4','3/6')+aSteps()+aMenu(),1),ph(X[2],Y[2],fIng(),1)],
 ['מנה · רשימת הכנה',ph(X[0],Y[3],bHero(D,1)+bSwap(1,1)+bPrep()),ph(X[1],Y[3],aHead(D)+aMeta(1)+aProg('2/5','3/6',1)+aSeg(1,'2/5','3/6',1)+aPrep()),ph(X[2],Y[3],fPrep())]];
rows.forEach((r,i)=>{h+=`<div class="lab" style="left:${X[0]}px;top:${Y[i]-34}px">${r[0]}</div>`+r[1]+r[2]+r[3]});
document.getElementById('root').innerHTML=h;lucide.createIcons();
</script></body></html>
