<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="./colors_and_type.css">
  <script src="./image-slot.js"></script>
  <style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes popIn { from { opacity: 0; transform: scale(0.96) translateY(6px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
    body { margin: 0; }
    a { color: var(--color-primary); text-decoration: none; }
    a:hover { color: var(--color-primary-hover); }
    input:focus, textarea:focus { outline: none; border-color: var(--border-focus) !important; box-shadow: var(--shadow-focus); }
    .venue-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--space-5); }
    .venue-card { background: var(--bg-glass); backdrop-filter: var(--blur-glass); -webkit-backdrop-filter: var(--blur-glass); border: 1px solid var(--border-glass); border-radius: var(--radius-lg); box-shadow: var(--shadow-glass); overflow: hidden; transition: transform 0.25s var(--ease-spring), box-shadow 0.25s var(--ease-spring); animation: fadeIn 0.3s var(--ease-spring); display: block; }
    .venue-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
  </style>
</helmet>

<div dir="rtl" style="position: relative; min-height: 100vh; background: var(--bg-body); font-family: var(--font-sans); overflow-x: hidden;">
  <div style="position: fixed; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(ellipse 700px 480px at 85% 15%, rgba(20,184,166,0.12), transparent), radial-gradient(ellipse 550px 550px at 15% 75%, rgba(251,191,36,0.08), transparent), radial-gradient(ellipse 450px 350px at 50% 50%, rgba(14,165,233,0.06), transparent);"></div>

  <div style="position: relative; z-index: 1;">
    <!-- TOP NAV -->
    <nav style="position: sticky; top: 0; z-index: 50; display: flex; align-items: center; height: 3.5rem; padding: 0 var(--space-6); gap: var(--space-6); background: var(--bg-frosted-nav); backdrop-filter: var(--blur-nav); -webkit-backdrop-filter: var(--blur-nav); border-bottom: 1px solid var(--border-glass); box-shadow: var(--shadow-nav);">
      <div style="display: flex; align-items: center; gap: var(--space-2); flex-shrink: 0;">
        <div style="width: 32px; height: 32px; border-radius: var(--radius-md); background: linear-gradient(135deg, var(--color-primary), var(--color-primary-hover)); display: grid; place-content: center; color: var(--color-text-on-primary); font-weight: var(--fw-extrabold); font-size: var(--fs-sm); box-shadow: var(--shadow-glow);">fC</div>
        <span style="font-weight: var(--fw-bold); font-size: var(--fs-lg); color: var(--color-text-main); letter-spacing: var(--tracking-tight);">foodCo</span>
      </div>
      <div style="display: flex; align-items: center; gap: 2px; padding: 4px; background: var(--bg-subtle); border: 1px solid var(--border-glass); border-radius: var(--radius-full); margin-inline-start: var(--space-4);">
        <a href="Dashboard.dc.html" style="display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; font-size: var(--fs-sm); font-weight: var(--fw-semibold); border-radius: var(--radius-full); color: var(--color-text-muted);">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"></rect><rect width="7" height="5" x="14" y="3" rx="1"></rect><rect width="7" height="9" x="14" y="12" rx="1"></rect><rect width="7" height="5" x="3" y="16" rx="1"></rect></svg>
          דשבורד
        </a>
        <a href="Inventory.dc.html" style="display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; font-size: var(--fs-sm); font-weight: var(--fw-semibold); border-radius: var(--radius-full); color: var(--color-text-muted);">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path><path d="M12 22V12"></path><path d="M3.29 7 12 12l8.71-5"></path><path d="m7.5 4.27 9 5.15"></path></svg>
          מלאי
        </a>
        <a href="RecipeBook.dc.html" style="display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; font-size: var(--fs-sm); font-weight: var(--fw-semibold); border-radius: var(--radius-full); color: var(--color-text-muted);">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg>
          ספר מתכונים
        </a>
        <a href="MenuIntelligence.dc.html" style="display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; font-size: var(--fs-sm); font-weight: var(--fw-semibold); border-radius: var(--radius-full); color: var(--color-text-muted);">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 6 4 14"></path><path d="M12 6v14"></path><path d="M8 8v12"></path><path d="M4 4v16"></path></svg>
          בניית תפריטים
        </a>
        <a href="MenuLibrary.dc.html" style="display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; font-size: var(--fs-sm); font-weight: var(--fw-semibold); border-radius: var(--radius-full); color: var(--color-text-muted);">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 1.45-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.55 6a2 2 0 0 1-1.94 1.5H4a2 2 0 0 1-2-2V5c0-1.1.9-2 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"></path></svg>
          ספריית תפריטים
        </a>
        <a href="Venues.dc.html" style="display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; font-size: var(--fs-sm); font-weight: var(--fw-semibold); border-radius: var(--radius-full); background: linear-gradient(180deg, var(--color-primary), var(--color-primary-hover)); color: #fff; box-shadow: var(--shadow-glow);">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg>
          אתרים
        </a>
        <a href="Suppliers.dc.html" style="display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; font-size: var(--fs-sm); font-weight: var(--fw-semibold); border-radius: var(--radius-full); color: var(--color-text-muted);">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"></path><path d="M15 18H9"></path><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"></path><circle cx="17" cy="18" r="2"></circle><circle cx="7" cy="18" r="2"></circle></svg>
          ספקים
        </a>
        <a href="Equipment.dc.html" style="display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; font-size: var(--fs-sm); font-weight: var(--fw-semibold); border-radius: var(--radius-full); color: var(--color-text-muted);">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
          ציוד
        </a>
        <a href="MetadataManager.dc.html" style="display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; font-size: var(--fs-sm); font-weight: var(--fw-semibold); border-radius: var(--radius-full); color: var(--color-text-muted);">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 1v6m0 10v6M4.22 4.22l4.24 4.24m6.28 6.28 4.24 4.24M1 12h6m10 0h6M4.22 19.78l4.24-4.24m6.28-6.28 4.24-4.24"></path></svg>
          מטא-דאטה
        </a>
        <a href="Trash.dc.html" style="display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; font-size: var(--fs-sm); font-weight: var(--fw-semibold); border-radius: var(--radius-full); color: var(--color-text-muted);">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          אשפה
        </a>
      </div>
      <div style="display: flex; align-items: center; gap: var(--space-2); margin-inline-start: auto; flex-shrink: 0;">
        <div style="display: inline-flex; align-items: center; gap: var(--space-2); padding: 4px 10px 4px 4px; background: var(--bg-glass); border: 1px solid var(--border-default); border-radius: var(--radius-full);">
          <span style="display: grid; place-content: center; width: 26px; height: 26px; background: linear-gradient(135deg, var(--color-primary), var(--color-primary-hover)); color: #fff; border-radius: 50%; font-weight: var(--fw-bold); font-size: var(--fs-xs);">רכ</span>
          <span style="font-weight: var(--fw-semibold); font-size: var(--fs-sm); color: var(--color-text-main);">רועי כהן</span>
        </div>
      </div>
    </nav>

    <!-- MAIN -->
    <div style="max-width: 1200px; margin: 0 auto; padding: var(--space-6) var(--space-6) var(--space-12);">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); margin-bottom: var(--space-6); flex-wrap: wrap;">
        <div>
          <h1 style="margin: 0; font-size: var(--fs-xl); font-weight: var(--fw-bold); letter-spacing: var(--tracking-tight); color: var(--color-text-main);">אתרים</h1>
          <p style="margin: 2px 0 0; font-size: var(--fs-sm); color: var(--color-text-muted);">ניהול מיקומים ואתרי הפעלה</p>
        </div>
        <button onClick="{{ openAddModal }}" style="display: inline-flex; align-items: center; gap: 6px; padding: 0 var(--space-4); height: 38px; background: linear-gradient(180deg, var(--color-primary), var(--color-primary-hover)); border: none; border-radius: var(--radius-full); color: #fff; font-size: var(--fs-sm); font-weight: var(--fw-semibold); cursor: pointer; box-shadow: var(--shadow-glow);">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
          הוספת אתר
        </button>
      </div>

      <div class="venue-grid">
        <sc-for list="{{ venues }}" as="v" hint-placeholder-count="4">
          <a href="{{ v.href }}" class="venue-card">
            <div style="position: relative; height: 140px;">
              <image-slot id="{{ v.imgId }}" shape="rect" placeholder="הוסף תמונת אתר" style="width: 100%; height: 100%;"></image-slot>
              <span style="position: absolute; top: 10px; right: 10px; display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: var(--radius-full); font-size: var(--fs-xs); font-weight: var(--fw-semibold); backdrop-filter: var(--blur-glass); {{ v.statusStyle }}">
                <span style="width: 6px; height: 6px; border-radius: 50%; background: currentColor;"></span>
                {{ v.statusLabel }}
              </span>
            </div>
            <div style="padding: var(--space-4);">
              <div style="font-size: var(--fs-md); font-weight: var(--fw-bold); color: var(--color-text-main); margin-bottom: 4px;">{{ v.name }}</div>
              <div style="display: flex; align-items: center; gap: 5px; font-size: var(--fs-sm); color: var(--color-text-muted); margin-bottom: var(--space-3);">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"></path><circle cx="12" cy="10" r="3"></circle></svg>
                <span>{{ v.address }}</span>
              </div>
              <div style="display: flex; align-items: center; justify-content: space-between; padding-top: var(--space-3); border-top: 1px dashed var(--border-default);">
                <div style="display: flex; align-items: center; gap: 5px; font-size: var(--fs-xs); color: var(--color-text-secondary);">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                  {{ v.capacity }} מקומות
                </div>
                <div style="font-size: var(--fs-xs); color: var(--color-primary-hover); font-weight: var(--fw-semibold);">{{ v.menuCountLabel }}</div>
              </div>
            </div>
          </a>
        </sc-for>
      </div>
    </div>
  </div>

  <!-- ADD VENUE MODAL -->
  <sc-if value="{{ addModalOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; background: var(--overlay-backdrop); backdrop-filter: var(--blur-modal); animation: overlayIn 0.2s var(--ease-smooth);" onClick="{{ closeAddModal }}">
      <div style="width: min(420px, 92vw); background: var(--bg-glass-strong); backdrop-filter: var(--blur-modal); border: 1px solid var(--border-glass); border-radius: var(--radius-xl); box-shadow: var(--shadow-modal); padding: var(--space-6); animation: popIn 0.2s var(--ease-spring);" onClick="{{ stopProp }}">
        <h2 style="margin: 0 0 var(--space-4); font-size: var(--fs-lg); font-weight: var(--fw-bold); color: var(--color-text-main);">הוספת אתר חדש</h2>
        <div style="display: flex; flex-direction: column; gap: var(--space-3);">
          <div>
            <label style="display: block; margin-bottom: 4px; font-size: var(--fs-xs); font-weight: var(--fw-semibold); color: var(--color-text-secondary);">שם האתר</label>
            <input type="text" value="{{ newVenueName }}" onChange="{{ onNewNameChange }}" placeholder="לדוגמה: אולם גני התערוכה" style="width: 100%; box-sizing: border-box; padding: 9px 12px; background: var(--bg-glass); border: 1px solid var(--border-default); border-radius: var(--radius-md); font-size: var(--fs-sm); font-family: var(--font-sans); color: var(--color-text-main);">
          </div>
          <div>
            <label style="display: block; margin-bottom: 4px; font-size: var(--fs-xs); font-weight: var(--fw-semibold); color: var(--color-text-secondary);">כתובת</label>
            <input type="text" value="{{ newVenueAddress }}" onChange="{{ onNewAddressChange }}" placeholder="רחוב, עיר" style="width: 100%; box-sizing: border-box; padding: 9px 12px; background: var(--bg-glass); border: 1px solid var(--border-default); border-radius: var(--radius-md); font-size: var(--fs-sm); font-family: var(--font-sans); color: var(--color-text-main);">
          </div>
          <div>
            <label style="display: block; margin-bottom: 4px; font-size: var(--fs-xs); font-weight: var(--fw-semibold); color: var(--color-text-secondary);">קיבולת (מקומות ישיבה)</label>
            <input type="number" value="{{ newVenueCapacity }}" onChange="{{ onNewCapacityChange }}" min="0" style="width: 100%; box-sizing: border-box; padding: 9px 12px; background: var(--bg-glass); border: 1px solid var(--border-default); border-radius: var(--radius-md); font-size: var(--fs-sm); font-family: var(--font-sans); color: var(--color-text-main);">
          </div>
        </div>
        <div style="display: flex; gap: var(--space-2); margin-top: var(--space-5); justify-content: flex-end;">
          <button onClick="{{ closeAddModal }}" style="padding: 0 var(--space-4); height: 38px; background: var(--bg-glass); border: 1px solid var(--border-default); border-radius: var(--radius-full); color: var(--color-text-secondary); font-size: var(--fs-sm); font-weight: var(--fw-semibold); cursor: pointer;">ביטול</button>
          <button onClick="{{ saveNewVenue }}" style="padding: 0 var(--space-4); height: 38px; background: linear-gradient(180deg, var(--color-primary), var(--color-primary-hover)); border: none; border-radius: var(--radius-full); color: #fff; font-size: var(--fs-sm); font-weight: var(--fw-semibold); cursor: pointer; box-shadow: var(--shadow-glow);">שמירת אתר</button>
        </div>
      </div>
    </div>
  </sc-if>

  <!-- TOAST -->
  <sc-if value="{{ toastVisible }}" hint-placeholder-val="{{ false }}">
    <div style="position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%); z-index: 400; display: flex; align-items: center; gap: var(--space-2); padding: 11px 20px; background: var(--color-text-main); color: #fff; border-radius: var(--radius-full); font-size: var(--fs-sm); font-weight: var(--fw-medium); box-shadow: var(--shadow-modal); animation: popIn 0.2s var(--ease-spring);">
      {{ toastMessage }}
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const VENUES = [
  { id: 1, name: 'אולם גני התערוכה', address: 'דרך השלום 12, תל אביב', capacity: 220, menuCount: 3, active: true },
  { id: 2, name: 'חצר המסגריה', address: 'הרצל 84, יפו', capacity: 90, menuCount: 1, active: true },
  { id: 3, name: 'גג הצפון', address: 'דיזנגוף 210, תל אביב', capacity: 60, menuCount: 0, active: false },
  { id: 4, name: 'וילת הכרם', address: 'שביל הכרמים 5, זכרון יעקב', capacity: 140, menuCount: 2, active: true }
];

class Component extends DCLogic {
  state = {
    addModalOpen: false,
    newVenueName: '',
    newVenueAddress: '',
    newVenueCapacity: '',
    toastVisible: false,
    toastMessage: ''
  };

  showToast(msg) {
    clearTimeout(this._toastTimer);
    this.setState({ toastVisible: true, toastMessage: msg });
    this._toastTimer = setTimeout(() => this.setState({ toastVisible: false }), 2200);
  }
  openAddModal() { this.setState({ addModalOpen: true, newVenueName: '', newVenueAddress: '', newVenueCapacity: '' }); }
  closeAddModal() { this.setState({ addModalOpen: false }); }
  stopProp(e) { e.stopPropagation(); }
  saveNewVenue() {
    if (!this.state.newVenueName.trim()) return;
    this.setState({ addModalOpen: false });
    this.showToast('האתר נוסף בהצלחה');
  }

  renderVals() {
    const s = this.state;
    const venues = VENUES.map(v => ({
      id: v.id,
      href: 'VenueDetail.dc.html?id=' + v.id,
      imgId: 'venue-photo-' + v.id,
      name: v.name,
      address: v.address,
      capacity: v.capacity,
      menuCountLabel: v.menuCount > 0 ? (v.menuCount + ' תפריטים משויכים') : 'אין תפריטים',
      statusLabel: v.active ? 'פעיל' : 'לא פעיל',
      statusStyle: v.active
        ? 'background: rgba(20,184,166,0.85); color: #fff;'
        : 'background: rgba(100,116,139,0.75); color: #fff;'
    }));

    return {
      venues,
      addModalOpen: s.addModalOpen,
      openAddModal: () => this.openAddModal(),
      closeAddModal: () => this.closeAddModal(),
      stopProp: (e) => this.stopProp(e),
      newVenueName: s.newVenueName,
      onNewNameChange: (v) => this.setState({ newVenueName: v }),
      newVenueAddress: s.newVenueAddress,
      onNewAddressChange: (v) => this.setState({ newVenueAddress: v }),
      newVenueCapacity: s.newVenueCapacity,
      onNewCapacityChange: (v) => this.setState({ newVenueCapacity: v }),
      saveNewVenue: () => this.saveNewVenue(),
      toastVisible: s.toastVisible,
      toastMessage: s.toastMessage
    };
  }
}
</script>
</body>
</html>
