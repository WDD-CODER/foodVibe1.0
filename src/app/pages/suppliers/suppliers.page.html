@if (!isListRoute_()) {
<nav class="suppliers-nav" dir="rtl">
  <button type="button" class="c-btn-ghost c-btn-ghost--sm" (click)="goBackToList()">
    <lucide-icon name="arrow-right" [size]="16"></lucide-icon>
    {{ 'supplier_list' | translatePipe }}
  </button>
  @for (item of navRoutes_(); track item.path) {
  <a [routerLink]="item.path" routerLinkActive="active" class="c-chip c-chip--tab">
    {{ item.labelKey | translatePipe }}
  </a>
  }
</nav>
}
<router-outlet></router-outlet>
