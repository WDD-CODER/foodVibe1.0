<div class="supplier-form-container" dir="rtl">
  <header class="form-header">
    @if (isEditMode_()) {
      <h2>{{ 'edit' | translatePipe }}: {{ supplierForm_.get('nameHebrew')?.value }}</h2>
    } @else {
      <h2>{{ 'add_supplier' | translatePipe }}</h2>
    }
  </header>

  <form [formGroup]="supplierForm_" (ngSubmit)="onSubmit()" class="form-body">
    <div class="form-section">
      <app-form-field label="name" forId="nameHebrew" [error]="nameError()">
        <input
          id="nameHebrew"
          type="text"
          formControlName="nameHebrew"
          class="c-input"
          [class.c-input--invalid]="validationErrors_()['nameHebrew']"
          [attr.aria-invalid]="validationErrors_()['nameHebrew'] ? true : null"
        />
      </app-form-field>
      <app-form-field label="contact_person" forId="contactPerson">
        <input id="contactPerson" type="text" formControlName="contactPerson" class="c-input" />
      </app-form-field>
      <app-form-field label="phone" forId="phone">
        <input id="phone" type="tel" formControlName="phone" class="c-input" />
      </app-form-field>
      <app-form-field label="min_order" forId="minOrderMov">
        <input id="minOrderMov" type="number" formControlName="minOrderMov" min="0" class="c-input" />
      </app-form-field>
      <app-form-field label="lead_time" forId="leadTimeDays">
        <input id="leadTimeDays" type="number" formControlName="leadTimeDays" min="0" class="c-input" />
      </app-form-field>
    </div>

    <div class="form-section days-section">
      <h3>{{ 'delivery_days' | translatePipe }}</h3>
      <div class="c-chip-group" formArrayName="deliveryDays">
        @for (ctrl of deliveryDaysArray.controls; track $index) {
          <label class="c-chip c-chip--toggle">
            <input type="checkbox" [formControlName]="$index" />
            <span>{{ dayKeys[$index] | translatePipe }}</span>
          </label>
        }
      </div>
    </div>

    <div class="c-form-actions">
      <button type="button" class="c-btn-ghost" (click)="onCancel()">
        {{ 'cancel' | translatePipe }}
      </button>
      <button type="submit" class="c-btn-primary" [disabled]="isSaving_()">
        {{ 'save' | translatePipe }}
      </button>
    </div>
  </form>
</div>
