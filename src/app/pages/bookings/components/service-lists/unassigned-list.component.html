<section class="c-input-stack" data-testid="unassigned-list" [attr.aria-label]="'nb_unassigned_title' | translatePipe">
  <h3 class="sl__title">
    <lucide-icon name="alert-triangle" [size]="16" aria-hidden="true"></lucide-icon>
    {{ 'nb_unassigned_title' | translatePipe }}
  </h3>
  @if (rows().length === 0) {
    <div data-testid="unassigned-empty">
      <app-empty-state [compact]="true" messageKey="nb_unassigned_empty" icon="users" />
    </div>
  } @else {
    <ul class="c-list c-list--plain sl__rows sl__rows--short" role="list">
      @for (r of rows(); track r.booking._id) {
        <li class="c-list-row" role="listitem" data-testid="unassigned-row">
          <span class="c-list-body-cell sl__time" dir="ltr">{{ r.booking.time }}</span>
          <span class="c-list-body-cell sl__name">{{ r.name }}</span>
          <span class="c-list-body-cell sl__party">
            <lucide-icon name="users" [size]="14" aria-hidden="true"></lucide-icon>
            {{ r.booking.partySize }}
          </span>
          <span class="c-list-body-cell c-col-actions">
            @if (live()) {
              <button
                type="button"
                class="c-chip c-chip--tap"
                data-testid="unassigned-assign"
                (click)="assign.emit(r.booking._id)"
              >
                {{ 'nb_assign' | translatePipe }}
              </button>
            }
          </span>
        </li>
      }
    </ul>
  }
</section>
