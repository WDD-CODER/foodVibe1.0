<form
  class="business-name c-glass-panel"
  dir="rtl"
  data-testid="business-name-form"
  [formGroup]="form"
  (ngSubmit)="save()"
>
  <app-form-field
    label="business_name"
    forId="business-name-input"
    hint="settings_business_name_help"
    [error]="errorKey_()"
  >
    <span class="c-input-wrapper" [class.c-input--invalid]="errorKey_()">
      <input
        id="business-name-input"
        type="text"
        formControlName="name"
        autocomplete="organization"
        data-testid="business-name-input"
        [attr.maxlength]="maxLength"
        [attr.aria-invalid]="errorKey_() ? true : null"
      />
    </span>
  </app-form-field>
  <div class="c-form-actions">
    <button
      type="submit"
      class="c-btn-primary"
      data-testid="business-name-save"
      [disabled]="!canSave()"
      [attr.aria-busy]="isSaving_() || null"
    >
      {{ (isSaving_() ? 'saving' : 'save') | translatePipe }}
    </button>
  </div>
</form>
