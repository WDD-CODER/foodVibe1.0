<div class="equipment-form-container" dir="rtl">
  <header class="form-header">
    @if (isEditMode_()) {
      <h2>{{ 'edit' | translatePipe }}: {{ equipmentForm_.get('nameHebrew')?.value }}</h2>
    } @else {
      <h2>{{ 'add_equipment' | translatePipe }}</h2>
    }
  </header>

  <form [formGroup]="equipmentForm_" (ngSubmit)="onSubmit()" class="form-body">
    <div class="form-section">
      <app-form-field
        label="name"
        forId="nameHebrew"
        [error]="validationErrors_()['nameHebrew'] ? 'field_name_required' : null"
      >
        <input
          #nameInput
          id="nameHebrew"
          type="text"
          formControlName="nameHebrew"
          class="c-input"
          [class.c-input--invalid]="validationErrors_()['nameHebrew']"
          [attr.aria-invalid]="validationErrors_()['nameHebrew'] ? true : null"
        />
      </app-form-field>
      <app-form-field
        label="category"
        forId="category"
        [error]="validationErrors_()['category'] ? 'field_category_required' : null"
      >
        <app-custom-select
          triggerId="category"
          formControlName="category"
          [options]="categoryOptions"
          placeholder="category"
          [typeToFilter]="true"
          [class.c-input--invalid]="validationErrors_()['category']"
        />
      </app-form-field>
      <app-form-field label="owned_quantity" forId="ownedQuantity">
        <input id="ownedQuantity" type="number" formControlName="ownedQuantity" min="0" class="c-input" />
      </app-form-field>
      <div class="c-chip-group">
        <label class="c-chip c-chip--toggle">
          <input type="checkbox" formControlName="isConsumable" />
          <span>{{ 'is_consumable' | translatePipe }}</span>
        </label>
      </div>
      <app-form-field label="notes" forId="notes">
        <textarea id="notes" formControlName="notes" rows="2" class="c-input"></textarea>
      </app-form-field>
    </div>

    <div class="c-form-actions">
      <button type="button" class="c-btn-ghost" (click)="onCancel()">
        {{ 'cancel' | translatePipe }}
      </button>
      <button type="submit" class="c-btn-primary" [disabled]="isSaving_()">
        @if (isSaving_()) {
          <app-loader size="small" [inline]="true" />
        }
        {{ 'save' | translatePipe }}
      </button>
    </div>
  </form>
</div>
