<app-modal-shell size="md" titleKey="rq_no_table" [sheet]="true" [dismissible]="!busy()" (dismissed)="closed.emit()">
  <div class="c-modal-body c-input-stack" data-testid="approve-table-dialog">
    <p class="att-line" dir="ltr" data-testid="att-asked">{{ askedLine_() }}</p>

    @if (altChips_().length > 0) {
      <div class="c-input-stack" data-testid="att-alternatives">
        <span class="att-label">{{ 'rq_no_table_pick_time' | translatePipe }}</span>
        <div class="att-chips">
          @for (a of altChips_(); track a.date + a.time) {
            <button
              type="button"
              class="c-chip c-chip--tab"
              dir="ltr"
              [attr.data-testid]="'att-alt-' + a.time"
              [disabled]="busy()"
              (click)="pickTime(a)"
            >
              {{ a.label }}
            </button>
          }
        </div>
      </div>
    }

    @if (showMap_()) {
      <div class="c-input-stack" data-testid="att-tables">
        <span class="att-label">{{ 'rq_no_table_pick_table' | translatePipe }}</span>
        <div class="att-map">
          <app-floor-map [plan]="plan_()!" [states]="mapStates_()" (tableTapped)="onMapTap($event)" />
        </div>
      </div>
    }

    @if (nothing_()) {
      <p class="att-line" role="status" data-testid="att-none">{{ 'rq_no_table_none' | translatePipe }}</p>
    }
  </div>
  <div class="c-modal-actions">
    <button type="button" class="c-btn-ghost" data-testid="att-cancel" [disabled]="busy()" (click)="closed.emit()">
      {{ 'cancel' | translatePipe }}
    </button>
  </div>
</app-modal-shell>
