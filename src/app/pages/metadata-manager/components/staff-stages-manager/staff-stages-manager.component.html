<section class="c-glass-panel mm-card" data-testid="staff-stages-card">
  <header class="c-card-head">
    <lucide-icon name="eye" class="c-card-head__icon" [size]="18"></lucide-icon>
    <h2 class="c-card-head__title">{{ 'metadata_staff_stages_title' | translatePipe }}</h2>
  </header>
  <p class="mm-card-desc">{{ 'metadata_staff_stages_desc' | translatePipe }}</p>

  <div class="c-chip-group">
    @for (stage of stages; track stage) {
      <label class="c-chip c-chip--toggle" [attr.data-testid]="'staff-stage-' + stage">
        <input
          #box
          type="checkbox"
          [checked]="checked().has(stage)"
          [disabled]="saving()"
          (change)="onToggle(stage, box)"
        />
        <span>{{ stageLabelKey(stage) | translatePipe }}</span>
      </label>
    }
  </div>
</section>
