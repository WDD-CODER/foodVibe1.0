<section class="c-glass-panel mm-card" data-testid="ai-examples-share-card">
  <header class="c-card-head">
    <lucide-icon name="sparkles" class="c-card-head__icon" [size]="18"></lucide-icon>
    <h2 class="c-card-head__title">{{ 'metadata_ai_share_title' | translatePipe }}</h2>
  </header>
  <p class="mm-card-desc">{{ 'metadata_ai_learn_desc' | translatePipe }}</p>

  <div class="c-chip-group">
    <span
      class="c-chip c-chip--tap is-locked"
      tabindex="0"
      data-testid="ai-examples-share-state"
      [attr.title]="'metadata_ai_private_tooltip' | translatePipe"
      [attr.aria-label]="(stateKey_() | translatePipe) + ' — ' + ('metadata_ai_private_tooltip' | translatePipe)"
    >
      <lucide-icon name="lock" [size]="14"></lucide-icon>
      <span>{{ stateKey_() | translatePipe }}</span>
    </span>
  </div>
</section>
