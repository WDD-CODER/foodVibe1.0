@if (visible()) {
  <section
    class="fd-week c-glass-panel"
    data-testid="frontdesk-week-card"
    dir="rtl"
    [attr.aria-label]="'frontdesk_week_title' | translatePipe"
  >
    <header class="fd-week__head">
      <span class="fd-week__icon"><lucide-icon name="clipboard-list" [size]="16" /></span>
      <h2 class="fd-week__title">{{ 'frontdesk_week_title' | translatePipe }}</h2>
      <a class="fd-week__link" routerLink="/requests">{{ 'frontdesk_week_all_requests' | translatePipe }}</a>
    </header>
    <p class="fd-week__sentence" data-testid="frontdesk-week-sentence">{{ sentence() }}</p>
  </section>
}
