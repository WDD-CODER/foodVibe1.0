@if (open()) {
  <div class="c-modal-overlay" (click)="onClose()" (keydown.escape)="onClose()">
    <div
      class="c-modal-card paste-ingredients-card"
      dir="rtl"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="'paste_ingredients' | translatePipe"
      (click)="$event.stopPropagation()"
    >
      <h3>{{ 'paste_ingredients' | translatePipe }}</h3>

      <div class="c-modal-body">
        <textarea
          #pasteBox
          class="c-input paste-box"
          dir="rtl"
          rows="8"
          spellcheck="false"
          [value]="text_()"
          (input)="text_.set($any($event.target).value)"
        ></textarea>
        <p class="paste-hint">{{ 'paste_ingredients_hint' | translatePipe }}</p>
      </div>

      <div class="c-modal-actions">
        <button type="button" class="c-btn-ghost" (click)="onClose()">{{ 'cancel' | translatePipe }}</button>
        <button type="button" class="c-btn-primary" [disabled]="!text_().trim()" (click)="onSubmit()">
          {{ 'paste_ingredients_add' | translatePipe }}
        </button>
      </div>
    </div>
  </div>
}
