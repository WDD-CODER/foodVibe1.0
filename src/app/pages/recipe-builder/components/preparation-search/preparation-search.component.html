<div class="search-container" dir="rtl" (appClickOutside)="showResults_.set(false)">
  <!-- Multi-line field so a long preparation name wraps and grows; Enter saves the row and opens a new one. -->
  <app-search-combobox
    icon="search"
    placeholder="search_preparation"
    addLabelKey="add_new_preparation"
    [addOnlyTyped]="true"
    [multiline]="true"
    [(query)]="searchQuery_"
    [(open)]="showResults_"
    [options]="preparations_()"
    [labelOf]="preparationLabel_"
    [keyOf]="preparationKey_"
    [groupOf]="preparationCategory_"
    [minChars]="2"
    [selectOnFocus]="true"
    (picked)="onPicked($event)"
    (addChosen)="onAddChosen($event)"
    (unhandledKeydown)="onSearchKeyUnhandled($event)"
  >
    <ng-template #optionTemplate let-entry>
      <span class="item-name">{{ entry.name }}</span>
      <span class="c-chip c-chip--tag c-chip--sm c-chip--square c-chip--teal">{{
        entry.category | translatePipe
      }}</span>
    </ng-template>
  </app-search-combobox>
</div>
