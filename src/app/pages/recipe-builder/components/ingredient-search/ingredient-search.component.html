<div class="search-container" dir="rtl" (clickOutside)="onClickOutside()">
  <app-search-combobox
    icon="search"
    placeholder="search_product_or_recipe"
    addLabelKey="add_new_ingredient"
    [(query)]="searchQuery_"
    [(open)]="showResults_"
    [options]="filteredResults_()"
    [knownOptions]="searchResults_()"
    [labelOf]="itemLabel_"
    [keyOf]="itemKey_"
    [clientFilter]="false"
    [minChars]="1"
    [selectOnFocus]="true"
    (picked)="selectItem($event.option)"
    (addChosen)="addNewProduct($event.typed)"
    (escaped)="cancelSearch.emit()"
    (unhandledKeydown)="onSearchKeyUnhandled($event)"
  >
    <ng-template #optionTemplate let-item>
      <span class="item-name">{{ item.nameHebrew }}</span>
      <span
        class="c-chip c-chip--tag c-chip--sm c-chip--square"
        [class.c-chip--green]="item.item_type_ === 'recipe'"
        [class.c-chip--teal]="item.item_type_ !== 'recipe'"
      >
        {{ (item.item_type_ === 'recipe' ? 'recipe' : 'product') | translatePipe }}
      </span>
    </ng-template>
  </app-search-combobox>
</div>
