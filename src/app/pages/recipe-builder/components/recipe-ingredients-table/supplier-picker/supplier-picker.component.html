@if (visible_()) {
  <span class="supplier-picker" (appClickOutside)="close()" (keydown.escape)="close()">
    <button
      type="button"
      class="c-icon-btn supplier-picker__btn"
      aria-haspopup="listbox"
      [attr.aria-expanded]="open_()"
      [attr.aria-label]="'pick_supplier' | translatePipe"
      [title]="title_()"
      (click)="toggle()"
    >
      <lucide-icon name="truck" [size]="16"></lucide-icon>
    </button>
    @if (open_()) {
      <ul class="supplier-picker__list" role="listbox">
        <li>
          <button
            type="button"
            class="supplier-picker__row"
            role="option"
            [attr.aria-selected]="auto_()"
            [disabled]="!canEdit()"
            (click)="pick(null)"
          >
            <lucide-icon
              class="supplier-picker__check"
              [class.is-off]="!auto_()"
              name="check"
              [size]="14"
            ></lucide-icon>
            <span class="supplier-picker__name">{{ 'supplier_cheapest_auto' | translatePipe }}</span>
          </button>
        </li>
        @for (row of rows_(); track row.supplierId) {
          <li>
            <button
              type="button"
              class="supplier-picker__row"
              role="option"
              [attr.aria-selected]="row.checked"
              [disabled]="!canEdit()"
              (click)="pick(row.supplierId)"
            >
              <lucide-icon
                class="supplier-picker__check"
                [class.is-off]="!row.checked"
                name="check"
                [size]="14"
              ></lucide-icon>
              <span class="supplier-picker__name">{{ row.name }}</span>
              <span class="supplier-picker__price">₪{{ row.price }}</span>
              @if (row.cheapest) {
                <span class="c-chip c-chip--sm supplier-picker__tag">{{ 'cheapest_supplier' | translatePipe }}</span>
              }
            </button>
          </li>
        }
      </ul>
    }
  </span>
}
