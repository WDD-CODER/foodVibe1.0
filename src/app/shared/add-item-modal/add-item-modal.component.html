@if (isOpen_()) {
  <app-modal-shell
    [titleKey]="config()?.title ?? null"
    [zIndex]="1100"
    [hasChanges]="hasChanges()"
    (dismissed)="cancel()"
  >
    @if (config(); as cfg) {
      <div class="c-modal-body">
        <div class="c-input-stack full-width">
          <label>{{ cfg.label | translatePipe }}</label>
          <input
            type="text"
            [ngModel]="value_()"
            (ngModelChange)="value_.set($event)"
            [placeholder]="cfg.placeholder || cfg.label | translatePipe"
            (keydown.enter)="save()"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
          />
        </div>
      </div>

      <div class="c-modal-actions">
        <button type="button" class="c-btn-ghost" (click)="cancel()">{{ 'cancel' | translatePipe }}</button>
        <button type="button" class="c-btn-primary" (click)="save()" [disabled]="!value_().trim()">
          {{ cfg.saveLabel | translatePipe }}
        </button>
      </div>
    }
  </app-modal-shell>
}
