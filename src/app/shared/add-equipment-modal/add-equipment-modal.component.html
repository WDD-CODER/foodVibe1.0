@if (isOpen_()) {
  <app-modal-shell titleKey="add_equipment" [hasChanges]="hasChanges()" (dismissed)="cancel()">
    <div class="c-modal-body">
      <div class="c-input-stack">
        <label>{{ 'equipment_name' | translatePipe }}</label>
        <input
          type="text"
          [ngModel]="name()"
          (ngModelChange)="name.set($event)"
          [placeholder]="'equipment_name' | translatePipe"
          (keydown.enter)="save()"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
        />
      </div>

      <div class="c-input-stack">
        <label>{{ 'category' | translatePipe }}</label>
        <app-custom-select
          [ngModel]="category()"
          (ngModelChange)="onCategoryChange($event)"
          [options]="categoryOptions()"
          [placeholder]="'category'"
          [typeToFilter]="true"
          [addNewValue]="'__add_new__'"
          addNewLabelKey="add_new_category"
          [allowTypedAdd]="true"
          (addNewChosen)="pendingAddName_.set($event)"
          [translateLabels]="true"
        />
      </div>
    </div>

    <div class="c-modal-actions">
      <button type="button" class="c-btn-ghost" (click)="cancel()">{{ 'cancel' | translatePipe }}</button>
      <button type="button" class="c-btn-primary" (click)="save()" [disabled]="!name().trim()">
        {{ 'save' | translatePipe }}
      </button>
    </div>
  </app-modal-shell>
}
