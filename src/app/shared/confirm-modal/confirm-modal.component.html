@if (modalService.isOpen()) {
  <app-modal-shell
    [cardClass]="cardClass_()"
    [labelledBy]="modalService.headerKey() ? 'confirm-modal-header' : 'confirm-modal-message'"
    (dismissed)="modalService.choose('cancel')"
  >
    @if (modalService.headerKey()) {
      <h3 id="confirm-modal-header" class="confirm-modal-header">{{ modalService.headerKey()! | translatePipe }}</h3>
    }
    <p
      id="confirm-modal-message"
      class="confirm-modal-message"
      [class.confirm-modal-message--danger]="modalService.variant() === 'danger'"
      [class.confirm-modal-message--warning]="modalService.variant() === 'warning'"
    >
      {{ modalService.message() | translatePipe }}
    </p>
    <div class="c-modal-actions">
      <button type="button" class="c-btn-ghost" (click)="modalService.choose('cancel')">
        {{ 'cancel' | translatePipe }}
      </button>
      @if (modalService.showSaveButton()) {
        <button type="button" class="c-btn-primary" (click)="modalService.choose('save')">
          {{ modalService.saveButtonLabel() | translatePipe }}
        </button>
      }
      <button
        type="button"
        class="c-btn-primary"
        [class.c-btn-primary--danger]="modalService.variant() === 'danger'"
        [class.c-btn-primary--warning]="modalService.variant() === 'warning'"
        (click)="modalService.choose('confirm')"
      >
        {{ modalService.saveLabel() | translatePipe }}
      </button>
    </div>
  </app-modal-shell>
}
