@if (arrowsRendered()) {
  <button
    type="button"
    class="sr-arrow sr-arrow--prev"
    [class.is-hidden]="!showPrev()"
    [attr.tabindex]="prevActive() ? null : -1"
    [attr.aria-hidden]="prevActive() ? null : 'true'"
    [attr.aria-label]="'scroll_prev' | translatePipe"
    (click)="scrollByStep('prev')"
  >
    <lucide-icon class="sr-icon-rtl" name="chevron-right" [size]="16"></lucide-icon>
    <lucide-icon class="sr-icon-ltr" name="chevron-left" [size]="16"></lucide-icon>
  </button>
}
<div class="sr-frame" [class.has-frame]="frame() === 'box'" [class.has-prev]="canPrev_()" [class.has-next]="canNext_()">
  <div
    #scroller
    class="sr-scroller"
    [attr.data-snap]="snap()"
    (scroll)="update()"
    (wheel)="onWheel($event)"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerEnd($event)"
    (pointercancel)="onPointerEnd($event)"
    (lostpointercapture)="onPointerEnd($event)"
  >
    <ng-content></ng-content>
  </div>
  <span class="sr-more sr-more--prev" [class.is-shown]="morePrev()" aria-hidden="true">
    <lucide-icon class="sr-icon-rtl" name="chevron-right" [size]="16"></lucide-icon>
    <lucide-icon class="sr-icon-ltr" name="chevron-left" [size]="16"></lucide-icon>
  </span>
  <span class="sr-more sr-more--next" [class.is-shown]="moreNext()" aria-hidden="true">
    <lucide-icon class="sr-icon-rtl" name="chevron-left" [size]="16"></lucide-icon>
    <lucide-icon class="sr-icon-ltr" name="chevron-right" [size]="16"></lucide-icon>
  </span>
</div>
@if (arrowsRendered()) {
  <button
    type="button"
    class="sr-arrow sr-arrow--next"
    [class.is-hidden]="!showNext()"
    [attr.tabindex]="nextActive() ? null : -1"
    [attr.aria-hidden]="nextActive() ? null : 'true'"
    [attr.aria-label]="'scroll_next' | translatePipe"
    (click)="scrollByStep('next')"
  >
    <lucide-icon class="sr-icon-rtl" name="chevron-left" [size]="16"></lucide-icon>
    <lucide-icon class="sr-icon-ltr" name="chevron-right" [size]="16"></lucide-icon>
  </button>
}
