<span class="c-add-new-icon">
  <svg
    width="14"
    height="14"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2.5"
    stroke-linecap="round"
    aria-hidden="true"
  >
    <path d="M12 5v14M5 12h14" />
  </svg>
</span>
@if (label(); as l) {
  @if (l.kind === 'typed') {
    <span class="add-option-row__text">{{ 'add' | translatePipe }} "{{ l.text }}"</span>
  } @else {
    <span class="add-option-row__text">{{ l.key | translatePipe }}</span>
  }
}
