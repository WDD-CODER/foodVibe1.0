<div class="list-container" [attr.dir]="dir()">
  <header class="list-header">
    <button type="button" class="open-panel-btn" (click)="panelToggle.emit()" aria-label="Toggle filters">
      <lucide-icon name="sliders-vertical" [size]="16"></lucide-icon>
    </button>
    <div class="header-back-btn">
      <ng-content select="[shell-back-btn]"></ng-content>
    </div>
    <div class="header-start">
      <ng-content select="[shell-title]"></ng-content>
      @if (resultCountText(); as text) {
        <p class="list-result-count">{{ text }}</p>
      }
    </div>
    <div class="header-spacer"></div>
    <div class="header-search">
      <ng-content select="[shell-search]"></ng-content>
    </div>
    <div class="header-spacer"></div>
    <div class="header-actions">
      <ng-content select="[shell-actions]"></ng-content>
    </div>
    <div class="header-ham-mirror" aria-hidden="true"></div>
  </header>

  <div class="selection-bar-area">
    <ng-content select="[shell-selection-bar]"></ng-content>
  </div>

  <section class="table-area">
    <!-- Plan 346: pagination + column header stay pinned while rows scroll (sticky at every
         width; on desktop the body scrolls inside, below it). -->
    <div class="table-top" #tableTop>
      <div class="table-pagination" (click)="onPaginationClick($event)">
        <ng-content select="[shell-pagination]"></ng-content>
      </div>
      <div class="table-header">
        <ng-content select="[shell-table-header]"></ng-content>
      </div>
    </div>
    <div class="table-body" #tableBody>
      <ng-content select="[shell-table-body]"></ng-content>
    </div>
  </section>

  <!-- Outside .table-area on purpose: that section has backdrop-filter, which makes it
       the containing block for any position:fixed descendant (CSS spec, not a bug) —
       a row-edit-as-modal projected into shell-table-body would be pinned to the
       table's box instead of the viewport. Content here escapes that. -->
  <ng-content select="[shell-modal]"></ng-content>

  <aside class="filter-panel" [class.collapsed]="!isPanelOpen()">
    <div class="panel-content">
      <!-- Out of flow on purpose: a hidden or shown clear button never reserves space or shifts the filters. -->
      <div class="panel-filter-clear">
        <ng-content select="[shell-filter-clear]"></ng-content>
      </div>
      <ng-content select="[shell-filters]"></ng-content>
    </div>
  </aside>
</div>
