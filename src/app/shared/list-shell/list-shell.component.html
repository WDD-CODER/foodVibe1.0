<div class="list-container" [attr.dir]="dir()">
  <!-- Plan 352: the shared compact page header — title + count at the inline-start, filter
       toggle + actions at the inline-end, search on row 1 (wide) or row 2 (narrow). -->
  <app-page-header
    class="list-header"
    [count]="resultCountText() ? resultCount() : null"
    [countLabel]="resultCountText()"
  >
    <ng-container ngProjectAs="[header-back]"><ng-content select="[shell-back-btn]"></ng-content></ng-container>
    <ng-container ngProjectAs="[header-title]"><ng-content select="[shell-title]"></ng-content></ng-container>
    <ng-container ngProjectAs="[header-search]"><ng-content select="[shell-search]"></ng-content></ng-container>
    <button
      header-leading
      type="button"
      class="open-panel-btn"
      (click)="panelToggle.emit()"
      [attr.aria-expanded]="isPanelOpen()"
      aria-label="Toggle filters"
    >
      <lucide-icon name="sliders-vertical" [size]="16"></lucide-icon>
    </button>
    <ng-container ngProjectAs="[header-actions]"><ng-content select="[shell-actions]"></ng-content></ng-container>
  </app-page-header>

  <div class="selection-bar-area">
    <ng-content select="[shell-selection-bar]"></ng-content>
  </div>

  <section class="table-area">
    <div class="table-header">
      <ng-content select="[shell-table-header]"></ng-content>
    </div>
    <div class="table-body">
      <ng-content select="[shell-table-body]"></ng-content>
    </div>
  </section>

  <!-- Outside .table-area on purpose: that section has backdrop-filter, which makes it
       the containing block for any position:fixed descendant (CSS spec, not a bug) —
       a row-edit-as-modal projected into shell-table-body would be pinned to the
       table's box instead of the viewport. Content here escapes that. -->
  <ng-content select="[shell-modal]"></ng-content>

  <aside class="filter-panel" [class.collapsed]="!isPanelOpen()">
    <div class="panel-content">
      <!-- Out of flow on purpose: a hidden or shown clear button never reserves space or shifts the filters. -->
      <div class="panel-filter-clear">
        <ng-content select="[shell-filter-clear]"></ng-content>
      </div>
      <ng-content select="[shell-filters]"></ng-content>
    </div>
  </aside>
</div>
