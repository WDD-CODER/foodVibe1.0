<div class="counter-grid">
  <button
    type="button"
    class="ctrl-btn"
    tabindex="-1"
    [disabled]="minusDisabled_()"
    appStepHold
    [stepHoldStop]="minusDisabled_()"
    (stepHold)="decrement($event)"
    [attr.aria-label]="'decrease' | translatePipe"
  >
    −
  </button>

  <div class="value-cell" appNumberBox [style.--value-width.px]="valueWidthPx_()">
    <span #mirrorSpan class="value-mirror" aria-hidden="true">{{ inputValue_() || displayValue_() }}</span>
    <input
      #valueInput
      type="number"
      class="value-input"
      appSelectOnFocus
      [value]="value()"
      (input)="onInput($event)"
      (blur)="onBlur($event)"
      (keydown)="onKeydown($event)"
      (keydown.enter)="onEnterKey($event)"
      [step]="stepOptions()?.integerOnly ? 1 : stepOptions()?.unit ? 0.01 : 0.001"
    />
  </div>

  <button
    type="button"
    class="ctrl-btn"
    tabindex="-1"
    [disabled]="plusDisabled_()"
    appStepHold
    [stepHoldStop]="plusDisabled_()"
    (stepHold)="increment($event)"
    [attr.aria-label]="'increase' | translatePipe"
  >
    +
  </button>
</div>
