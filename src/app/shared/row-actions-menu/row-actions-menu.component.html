@if (showTrigger()) {
  <button
    type="button"
    class="ram-trigger"
    (click)="toggle($event)"
    aria-label="Actions"
    [attr.aria-expanded]="isOpen()">
    <lucide-icon name="more-vertical" [size]="16"></lucide-icon>
  </button>
}

<!-- While open, this element is moved into a body-level CDK overlay pane (plan 362). -->
<div #popover class="ram-popover" [class.is-open]="isOpen()">
  <ng-content></ng-content>
</div>
