@if (!anchored()) {
  <button
    type="button"
    class="ram-trigger"
    (click)="toggle($event)"
    aria-label="Actions"
    [attr.aria-expanded]="isOpen()"
  >
    <lucide-icon name="more-vertical" [size]="16"></lucide-icon>
  </button>
}

<div
  class="ram-popover"
  #popover
  popover="manual"
  [class.is-open]="isOpen()"
  [style.visibility]="isPlaced() ? null : 'hidden'"
  [style.top.px]="popoverPos()?.top"
  [style.bottom.px]="popoverPos()?.bottom"
  [style.left.px]="popoverPos()?.left"
  [style.min-height.px]="popoverPos()?.minHeight"
>
  <ng-content></ng-content>
</div>
