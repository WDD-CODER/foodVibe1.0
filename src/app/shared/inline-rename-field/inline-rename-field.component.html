<input
  #field
  type="text"
  class="irf-input"
  [value]="value()"
  [attr.aria-label]="ariaLabelKey() | translatePipe"
  (keydown.enter)="onSave(); $event.preventDefault()"
  (keydown.escape)="onCancel()"
  autocomplete="off"
  autocorrect="off"
  autocapitalize="off"
  spellcheck="false"
/>
<button type="button" class="c-btn-primary irf-btn" (click)="onSave()">{{ 'save' | translatePipe }}</button>
<button type="button" class="c-btn-ghost--sm irf-btn" (click)="onCancel()">{{ 'cancel' | translatePipe }}</button>
