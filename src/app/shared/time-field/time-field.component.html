<div class="time-field">
  <input
    type="text"
    class="c-input time-field-text"
    [attr.inputmode]="coarse_() ? null : 'numeric'"
    dir="ltr"
    autocomplete="off"
    placeholder="hh:mm"
    maxlength="5"
    [readonly]="coarse_()"
    [attr.id]="coarse_() ? null : inputId() || null"
    [class.c-input--invalid]="red_()"
    [attr.aria-label]="ariaLabelKey() ? (ariaLabelKey()! | translatePipe) : null"
    [attr.aria-invalid]="red_() ? 'true' : null"
    [attr.aria-hidden]="coarse_() ? 'true' : null"
    [attr.tabindex]="coarse_() ? -1 : null"
    [disabled]="disabled()"
    [value]="text_()"
    (input)="onType($event)"
    (change)="onCommit()"
    (click)="onTextClick()"
  />
  <input
    #picker
    type="time"
    class="time-field-picker"
    [class.time-field-picker--touch]="coarse_()"
    [attr.id]="coarse_() ? inputId() || null : null"
    [attr.aria-label]="coarse_() && ariaLabelKey() ? (ariaLabelKey()! | translatePipe) : null"
    [attr.tabindex]="coarse_() ? null : -1"
    [attr.aria-hidden]="coarse_() ? null : 'true'"
    [disabled]="disabled()"
    [value]="value()"
    (change)="onPicked($event)"
  />
</div>
@if (showError_()) {
  <span class="c-field-error" role="alert">{{ 'time_invalid' | translatePipe }}</span>
}
