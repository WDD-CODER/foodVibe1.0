<div class="ux-label">{{ 'unit_of_measure' | translatePipe }}</div>
<div class="ux-grid" role="radiogroup" [attr.aria-label]="'unit_of_measure' | translatePipe">
  @for (opt of options(); track opt.value) {
    <button
      type="button"
      class="ux-tile"
      role="radio"
      [class.is-current]="opt.value === current()"
      [attr.aria-checked]="opt.value === current()"
      (click)="unitSelect.emit(opt.value)"
    >
      <span class="ux-unit">
        @if (opt.value === current()) {
          <lucide-icon name="check" [size]="14"></lucide-icon>
        }
        {{ opt.value | translatePipe }}
      </span>
      <b class="ux-amount">{{ opt.amount | formatQuantity }}</b>
    </button>
  }
  <button type="button" class="ux-tile ux-tile--add" (click)="addUnit.emit()">
    <lucide-icon name="plus" [size]="14"></lucide-icon>
    {{ 'new_unit' | translatePipe }}
  </button>
</div>
