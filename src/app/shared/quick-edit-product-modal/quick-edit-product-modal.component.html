@if (isOpen_() && config()) {
  <app-modal-shell
    size="md"
    cardClass="quick-edit-product-modal"
    labelKey="edit_product_title"
    [hasChanges]="hasChanges()"
    [saveAndClose]="saveAndClose"
    (dismissed)="onCancelled()"
  >
    <app-quick-edit-product-panel
      [product]="config()!.product"
      [tier]="config()!.tier"
      (saved)="onSaved()"
      (cancelled)="onCancelled()"
      (openFullEdit)="onOpenFullEdit()"
    >
    </app-quick-edit-product-panel>
  </app-modal-shell>
}
