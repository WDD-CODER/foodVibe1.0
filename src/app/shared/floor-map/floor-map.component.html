<div class="floor-map">
  <div
    #grid
    class="floor-map__grid"
    data-testid="floor-grid"
    [class.is-drawing]="drawing_()"
    [style.--fm-cols]="plan().grid.cols"
    [style.--fm-rows]="plan().grid.rows"
    [style.grid-template-columns]="'repeat(' + plan().grid.cols + ', 1fr)'"
    [style.grid-template-rows]="'repeat(' + plan().grid.rows + ', 1fr)'"
    (click)="onGridClick($event)"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp($event)"
    (pointercancel)="cancelDraw()"
  >
    @for (z of zones_(); track z.key) {
      @if (zoneEditable()) {
        <button
          type="button"
          cdkDrag
          cdkDragBoundary=".floor-map__grid"
          [cdkDragDisabled]="!z.selected"
          class="floor-map__zone"
          [class.is-selected]="z.selected"
          [attr.data-testid]="'floor-zone-' + z.key"
          [attr.aria-label]="z.name"
          [attr.aria-pressed]="z.selected ? 'true' : 'false'"
          [style.--fm-zone]="z.color"
          [style.grid-column]="z.rect.x + 1 + ' / span ' + z.rect.w"
          [style.grid-row]="z.rect.y + 1 + ' / span ' + z.rect.h"
          (click)="onZoneClick($event, z.key)"
          (cdkDragEnded)="onZoneDragEnded($event, z)"
        >
          <span class="floor-map__zone-label">{{ z.name }}</span>
        </button>
        @if (z.selected) {
          @for (corner of corners; track corner) {
            <span
              cdkDrag
              cdkDragBoundary=".floor-map__grid"
              class="floor-map__handle"
              [class]="'floor-map__handle--' + corner"
              [attr.data-corner]="corner"
              aria-hidden="true"
              [style.--fm-zone]="z.color"
              [style.grid-column]="(corner.endsWith('end') ? z.rect.x + z.rect.w : z.rect.x + 1) + ''"
              [style.grid-row]="(corner.startsWith('end') ? z.rect.y + z.rect.h : z.rect.y + 1) + ''"
              (cdkDragEnded)="onHandleDragEnded($event, z, corner)"
            ></span>
          }
        }
      } @else {
        <div
          class="floor-map__zone"
          aria-hidden="true"
          [attr.data-testid]="'floor-zone-' + z.key"
          [style.--fm-zone]="z.color"
          [style.grid-column]="z.rect.x + 1 + ' / span ' + z.rect.w"
          [style.grid-row]="z.rect.y + 1 + ' / span ' + z.rect.h"
        >
          <span class="floor-map__zone-label">{{ z.name }}</span>
        </div>
      }
    }
    @if (draft_(); as d) {
      <div
        class="floor-map__zone floor-map__zone--draft"
        data-testid="floor-zone-draft"
        aria-hidden="true"
        [style.--fm-zone]="d.color"
        [style.grid-column]="d.rect.x + 1 + ' / span ' + d.rect.w"
        [style.grid-row]="d.rect.y + 1 + ' / span ' + d.rect.h"
      ></div>
    }
    @for (t of views_(); track t.table.key) {
      <button
        type="button"
        cdkDrag
        cdkDragBoundary=".floor-map__grid"
        [cdkDragDisabled]="!draggable()"
        class="floor-map__table"
        [class.floor-map__table--round]="t.table.shape === 'round'"
        [class.floor-map__table--square]="t.table.shape === 'square'"
        [class.floor-map__table--rect]="t.table.shape === 'rect'"
        [class.floor-map__table--selected]="t.selected"
        [class.is-dimmed]="t.dimmed"
        [class.is-inactive]="t.inactive"
        [class.is-overlap]="t.warn"
        [class.is-joined]="t.joined"
        [class.is-zoned]="t.zoneColor !== null"
        [style.--fm-zone]="t.zoneColor"
        [attr.data-testid]="'floor-table-' + t.table.number"
        [attr.data-key]="t.table.key"
        [attr.data-x]="t.table.x"
        [attr.data-y]="t.table.y"
        [attr.data-state]="t.state"
        [attr.aria-pressed]="t.selected ? 'true' : 'false'"
        [attr.aria-label]="t.label"
        [style.grid-column]="t.table.x + 1 + ' / span ' + t.footprint.w"
        [style.grid-row]="t.table.y + 1 + ' / span ' + t.footprint.h"
        (click)="onTableClick($event, t.table.key)"
        (cdkDragEnded)="onDragEnded($event, t.table)"
      >
        <span class="floor-map__number">{{ t.table.number }}</span>
        @if (t.joined) {
          <lucide-icon class="floor-map__link" name="link" [size]="12" aria-hidden="true"></lucide-icon>
        }
        @if (t.warn) {
          <lucide-icon class="floor-map__warn" name="alert-triangle" [size]="14" aria-hidden="true"></lucide-icon>
        }
        @if (t.detail?.label) {
          <span class="floor-map__state" [attr.data-testid]="'floor-state-' + t.table.number">{{
            t.detail?.label
          }}</span>
          @if (t.detail?.name) {
            <span class="floor-map__name" [attr.data-testid]="'floor-name-' + t.table.number">{{
              t.detail?.name
            }}</span>
          }
          @if (t.detail?.time) {
            <span class="floor-map__time" dir="ltr">{{ t.detail?.time }}</span>
          }
        } @else if (t.inactive) {
          <span class="floor-map__state">{{ 'fp_state_inactive' | translatePipe }}</span>
        }
        @for (side of sides; track side) {
          @if (t.chairs[side] > 0) {
            <span class="floor-map__chairs" [class]="'floor-map__chairs--' + side" aria-hidden="true">
              @for (c of chairIndexes(t.chairs[side]); track c) {
                <span class="floor-map__chair"></span>
              }
            </span>
          }
        }
      </button>
    }
  </div>
</div>
