@if (acting_()) {
  <div class="acting-banner" role="status" data-testid="acting-banner">
    <span class="acting-banner__text">{{ text_() }}</span>
    <button
      type="button"
      class="c-btn-ghost acting-banner__back"
      data-testid="acting-back-home"
      [disabled]="isSwitching_()"
      (click)="backHome()"
    >
      <lucide-icon name="undo-2" [size]="16"></lucide-icon>
      {{ 'acting_back_home' | translatePipe }}
    </button>
  </div>
}
