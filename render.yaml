services:
  # NOTE: the live service (foodvibe1-0-1-frankfurt) was created manually via the Render
  # dashboard, not from this Blueprint, so it does not auto-sync with this file. Any change
  # here (build/start command, env vars) must be manually mirrored on that service too.
  - type: web
    name: foodvibe1-0-1-frankfurt
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm install --prefix server && npm run build:render
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Not read anywhere in server/ code (server uses JWT_ACCESS_SECRET / JWT_REFRESH_SECRET
      # below) — kept only because it's already set on the live service; harmless if unused.
      - key: JWT_SECRET
        generateValue: true
      # Required — server/middleware/auth.js, server/routes/auth.js. Set in Render dashboard.
      - key: JWT_ACCESS_SECRET
        sync: false
      # Required — server/db.js throws and the process exits at startup without this.
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: MONGO_URI
        sync: false
      # TEMPORARY diagnostic (plan 302 M1). Enables the [data/query] doc-count/byte-count/
      # Mongo-timing lines in server/routes/generic.js so ~24h of real-use numbers can be
      # collected from the Render logs. It costs real CPU on this 0.1-shared-CPU tier
      # (JSON.stringify runs purely to measure payload size), so set it to "0" or remove
      # it once the sample is captured and written into the audit's Observed section.
      - key: PERF_LOG
        value: "1"
      # Set in Render dashboard — never commit the value
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGIN
        value: https://foodvibe1-0-1-frankfurt.onrender.com,https://wdd-coder.github.io,http://localhost:4200
